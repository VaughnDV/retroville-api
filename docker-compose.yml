version: '2'

services:
  postgres:
    image: postgres:9.6
  redis:
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    hostname: redis

  web:
    restart: always
    environment:
      - DJANGO_SECRET_KEY=local
      - ACCOUNT_SID=ACc48e90f3330049e8b8c2d6310799a54f
      - API_KEY=SKdfc0811aee5d74f3089fcb168399c356
      - API_KEY_SECRET=VXCIvNyRhOf1I3ipd1u8SwiXBfJe48NB
      - APP_SID=APe42149306b5831c329fbc5419ff861c3
      - REDIS_URI=redis://localhost:6379
      - REDIS_URL=redis://redis_db:6379
      - DEBUG=True
      - PUSH_CREDENTIAL_SID=CR35b55c0a2eeb63f0890fbe757b593796

    image: web
    build: ./
    command: >
      bash -c "python wait_for_postgres.py &&
               ./manage.py migrate &&
              ./manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/code
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    links:
      - redis
  documentation:
    restart: always
    build: ./
    command: "mkdocs serve"
    volumes:
      - ./:/code
    ports:
      - "8001:8001"

