services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retroville
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: retroville-api:local
    environment:
      DJANGO_SETTINGS_MODULE: retroville.settings.local
      DJANGO_SECRET_KEY: local-development-only
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/retroville
      REDIS_URL: redis://redis:6379/0
      PROVIDERS_USE_FAKES: "true"
      CELERY_TASK_ALWAYS_EAGER: "false"
    command: >
      sh -c "python wait_for_postgres.py &&
             python manage.py migrate &&
             python manage.py seed_demo &&
             daphne -b 0.0.0.0 -p 8000 retroville.asgi:application"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/')"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  worker:
    image: retroville-api:local
    environment:
      DJANGO_SETTINGS_MODULE: retroville.settings.local
      DJANGO_SECRET_KEY: local-development-only
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/retroville
      REDIS_URL: redis://redis:6379/0
      PROVIDERS_USE_FAKES: "true"
    command: >
      sh -c "python wait_for_postgres.py &&
             celery -A retroville worker --loglevel=info --max-tasks-per-child=100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data:
