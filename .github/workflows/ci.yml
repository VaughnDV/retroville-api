name: ci

on:
  push:
    branches: [master, main, modernise/showcase]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install
        run: poetry install --with dev --no-interaction
      - name: Ruff
        run: |
          poetry run ruff check retroville tests
          poetry run ruff format --check retroville tests
      - name: Typecheck
        run: make typecheck

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install
        run: poetry install --with dev --no-interaction
      - name: Unit tests
        run: make test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: retroville
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/retroville
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install
        run: poetry install --with dev --no-interaction
      - name: Integration tests
        run: make test-integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install
        run: poetry install --with dev --no-interaction
      - name: Vulnerability audit
        run: poetry run pip-audit
      - name: Licence policy
        run: test -f docs/security/licence-review.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          tags: retroville-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retroville-api:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - name: SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: retroville-api:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - name: Compose smoke
        run: |
          docker compose up -d --build
          python - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health/live/")
                  urllib.request.urlopen("http://127.0.0.1:8000/health/ready/")
                  print("smoke ok")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("compose smoke failed")
          PY
          docker compose down -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.1.3
      - name: Install
        run: poetry install --with docs --no-interaction
      - name: Build docs
        run: poetry run mkdocs build --strict
