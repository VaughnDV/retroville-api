name: codeql

on:
  push:
    branches: [master, main, modernise/showcase]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    if: ${{ !github.event.repository.private || (github.event.repository.security_and_analysis && github.event.repository.security_and_analysis.advanced_security && github.event.repository.security_and_analysis.advanced_security.status == 'enabled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: python
      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          upload: false
